name: Admin CI/CD

on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/ci-admin.yml"]
  pull_request:
    branches: [main]
    paths: ["admin/**", ".github/workflows/ci-admin.yml"]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.ref) || format('deploy-{0}', github.workflow) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  GO_VERSION: "1.26"
  DOCKER_IMAGE: ggorockee/like-zzix-admin
  INFRA_REPO: ggorockee/infra
  VALUES_FILE_PATH: charts/helm/prod/like-zzix/values.yaml

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate

  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tag
        id: meta
        run: echo "tag=$(date +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ./admin
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest

  # GitOps: infra 레포의 admin.image.tag를 올리면 ArgoCD가 배포
  update-manifest:
    name: Update Kubernetes Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          ref: main
          path: infra
      - name: Update values.yaml
        working-directory: ./server
        run: |
          go run ./cmd/bumpimage \
            -file "$GITHUB_WORKSPACE/infra/${{ env.VALUES_FILE_PATH }}" \
            -key admin.image.tag \
            -value "${{ needs.build-and-push.outputs.image_tag }}"
      - name: Create PR in Infra Repo
        working-directory: ./infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
          # Untrusted input: pass via env, never interpolate into the script.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add "${{ env.VALUES_FILE_PATH }}"
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          BRANCH="ci/update-like-zzix-admin-${TAG}"
          git checkout -b "$BRANCH"
          git commit -m "ci: Update like-zzix-admin image tag to ${TAG}"
          git push -u origin "$BRANCH"
          BODY="$(printf 'Auto-generated PR to update like-zzix-admin image tag\n\n**Image**: %s:%s\n**Triggered by**: %s\n' "$DOCKER_IMAGE" "$TAG" "$HEAD_COMMIT_MESSAGE")"
          PR_URL=$(gh pr create --title "ci: Update like-zzix-admin image to ${TAG}" --body "$BODY" --base main --head "$BRANCH")
          echo "Created PR: $PR_URL"
          gh pr merge --auto --squash --delete-branch "$PR_URL" || gh pr merge --squash --delete-branch "$PR_URL"
